<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog | SCRS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="student-courses-page">

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">S</div>
                <div>
                    <span class="sidebar-brand-name">SCRS</span>
                    <span class="sidebar-brand-sub">Student Portal</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-category">Main Navigation</div>
                <a href="/student/dashboard.html" class="nav-link">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/student/courses.html" class="nav-link active">
                    <span class="nav-icon">🔍</span>
                    <span>Browse Courses</span>
                </a>
                <a href="/student/my-courses.html" class="nav-link">
                    <span class="nav-icon">📚</span>
                    <span>My Courses</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="studentLogout()">
                    <span>🚪</span>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Topbar -->
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-menu-toggle" aria-label="Toggle navigation">☰</button>
                    <div class="topbar-welcome">
                        <h2 class="welcome-title">Course Catalog</h2>
                        <span class="current-date">Loading date...</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <div class="user-profile-badge">
                        <div class="user-avatar student-display-avatar">S</div>
                        <div>
                            <div class="user-name-text student-display-name">Student</div>
                            <div class="user-role-label student-display-dept">Student Profile</div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Curriculum Offerings</h1>
                        <p class="page-subtitle">Search, filter, and register for approved academic modules.</p>
                    </div>
                    <div>
                        <span class="badge badge-dept" id="course-results-count" style="font-size:0.85rem;padding:0.4rem 0.8rem;">Loading courses...</span>
                    </div>
                </div>

                <!-- Filter Bar -->
                <div class="filter-bar">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="search-course" class="search-input" placeholder="Search by course or faculty name...">
                    </div>

                    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                        <select id="filter-dept" class="filter-select">
                            <option value="">All Departments</option>
                        </select>

                        <select id="filter-sem" class="filter-select">
                            <option value="">All Semesters</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                        </select>
                    </div>
                </div>

                <!-- Course Cards Grid -->
                <div class="course-grid" id="courses-grid-container">
                    <div style="padding: 3rem; text-align: center; color: #94a3b8; grid-column: 1 / -1;">
                        <span class="spinner"></span> Loading course database...
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/courses.js"></script>
</body>
</html>
